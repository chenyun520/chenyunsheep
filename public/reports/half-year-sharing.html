<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半年度会议分享 · 泰哈主线版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;}
body{perspective:1400px;transform-style:preserve-3d;}
.stage{
  position:fixed;inset:0;width:100%;height:100%;border:0;display:block;
  background:#0c0c0c;visibility:hidden;pointer-events:none;opacity:0;
  transform:translate3d(0,0,0) scale(1);
  backface-visibility:hidden;transform-origin:50% 50%;
}
.stage.is-active{visibility:visible;pointer-events:auto;opacity:1;}

/* ===== 多样化整页转场：仅作用于外层 iframe，不修改任何原始页面 ===== */
.stage[class*="tx-"]{visibility:visible!important;pointer-events:none!important;will-change:transform,opacity;}

/* 1. 常规平滑淡入淡出 */
.stage.tx-fade-out{z-index:2!important;animation:txFadeOut .56s ease both;}
.stage.tx-fade-in{z-index:3!important;animation:txFadeIn .56s ease both;}
@keyframes txFadeOut{0%{opacity:1;transform:translate3d(0,0,0) scale(1)}100%{opacity:0;transform:translate3d(0,0,0) scale(.994)}}
@keyframes txFadeIn{0%{opacity:0;transform:translate3d(0,0,0) scale(1.006)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}

/* 2. 向左推页：常规演示文稿式 */
.stage.tx-slide-left-out{z-index:2!important;animation:txSlideLeftOut .62s cubic-bezier(.22,.61,.36,1) both;}
.stage.tx-slide-left-in{z-index:3!important;animation:txSlideLeftIn .62s cubic-bezier(.22,.61,.36,1) both;}
@keyframes txSlideLeftOut{0%{opacity:1;transform:translate3d(0,0,0)}100%{opacity:.18;transform:translate3d(-6%,0,0)}}
@keyframes txSlideLeftIn{0%{opacity:.35;transform:translate3d(6%,0,0)}100%{opacity:1;transform:translate3d(0,0,0)}}

/* 3. 向右推页：用于少数章节切换，避免方向单一 */
.stage.tx-slide-right-out{z-index:2!important;animation:txSlideRightOut .62s cubic-bezier(.22,.61,.36,1) both;}
.stage.tx-slide-right-in{z-index:3!important;animation:txSlideRightIn .62s cubic-bezier(.22,.61,.36,1) both;}
@keyframes txSlideRightOut{0%{opacity:1;transform:translate3d(0,0,0)}100%{opacity:.18;transform:translate3d(6%,0,0)}}
@keyframes txSlideRightIn{0%{opacity:.35;transform:translate3d(-6%,0,0)}100%{opacity:1;transform:translate3d(0,0,0)}}

/* 4. 轻微景深推镜：比电影转场克制，适合作为章节过渡 */
.stage.tx-soft-out{z-index:2!important;animation:txSoftOut .65s cubic-bezier(.22,.61,.36,1) both;}
.stage.tx-soft-in{z-index:3!important;animation:txSoftIn .65s cubic-bezier(.16,1,.3,1) both;}
@keyframes txSoftOut{0%{opacity:1;transform:translate3d(0,0,0) scale(1)}100%{opacity:0;transform:translate3d(-.5%,0,0) scale(1.018)}}
@keyframes txSoftIn{0%{opacity:0;transform:translate3d(.5%,0,0) scale(.985)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}

/* 5. 电影感转场：只在少数重点节点使用 */
.stage.tx-cinema-out{z-index:2!important;animation:txCinemaOut .78s cubic-bezier(.22,.61,.36,1) both;}
.stage.tx-cinema-in{z-index:3!important;animation:txCinemaIn .78s cubic-bezier(.16,1,.3,1) both;}
@keyframes txCinemaOut{0%{opacity:1;transform:translate3d(0,0,0) scale(1)}35%{opacity:.97;transform:translate3d(-.1%,0,0) scale(1.01)}100%{opacity:0;transform:translate3d(-1.1%,0,0) scale(1.032)}}
@keyframes txCinemaIn{0%{opacity:0;transform:translate3d(1.1%,0,0) scale(1.032)}35%{opacity:.22}72%{opacity:.9;transform:translate3d(.15%,0,0) scale(1.006)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}

/* 电影级外层遮切：仅 tx-cinema 时启用 */
#cinema-fx{position:fixed;inset:0;z-index:20;pointer-events:none;visibility:hidden;overflow:hidden;}
body.is-cinema #cinema-fx{visibility:visible;}
#cinema-fx .veil{position:absolute;inset:0;background:#050608;opacity:0;}
#cinema-fx .sweep{position:absolute;top:-12%;bottom:-12%;left:-48%;width:42%;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.015) 18%,rgba(255,255,255,.18) 49%,rgba(255,255,255,.03) 64%,transparent 100%);filter:blur(12px);transform:skewX(-13deg) translateX(-120%);mix-blend-mode:screen;opacity:0;}
#cinema-fx .flare{position:absolute;left:-25%;top:44%;width:42vw;height:20vh;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.16) 0%,rgba(255,221,145,.055) 28%,rgba(255,255,255,0) 72%);filter:blur(20px);opacity:0;transform:translate3d(0,-50%,0) scale(.7);mix-blend-mode:screen;}
#cinema-fx .grain{position:absolute;inset:-30%;opacity:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.20'/%3E%3C/svg%3E");mix-blend-mode:soft-light;}
#cinema-fx .bar{position:absolute;left:0;width:100%;height:0;background:#030405;box-shadow:0 0 26px rgba(0,0,0,.3);}
#cinema-fx .bar.top{top:0}#cinema-fx .bar.bottom{bottom:0}
body.is-cinema #cinema-fx .veil{animation:veilPulse .78s ease-in-out both;}
body.is-cinema #cinema-fx .sweep{animation:lightSweep .78s cubic-bezier(.18,.72,.25,1) both;}
body.is-cinema #cinema-fx .flare{animation:lensFlare .78s cubic-bezier(.16,1,.3,1) both;}
body.is-cinema #cinema-fx .grain{animation:grainPulse .78s steps(2,end) both;}
body.is-cinema #cinema-fx .bar.top,body.is-cinema #cinema-fx .bar.bottom{animation:letterbox .78s cubic-bezier(.22,.61,.36,1) both;}
@keyframes veilPulse{0%{opacity:0}40%{opacity:.18}53%{opacity:.24}100%{opacity:0}}
@keyframes lightSweep{0%{opacity:0;transform:skewX(-13deg) translateX(-130%)}28%{opacity:.12}53%{opacity:.5}80%{opacity:.12}100%{opacity:0;transform:skewX(-13deg) translateX(430%)}}
@keyframes lensFlare{0%{opacity:0;transform:translate3d(-10%,-50%,0) scale(.65)}42%{opacity:.04}56%{opacity:.26}76%{opacity:.06}100%{opacity:0;transform:translate3d(340%,-50%,0) scale(1.2)}}
@keyframes grainPulse{0%,100%{opacity:0}38%{opacity:.025}56%{opacity:.04}80%{opacity:.018}}
@keyframes letterbox{0%,100%{height:0}44%,58%{height:1.8vh}}

@media (prefers-reduced-motion:reduce){
  .stage[class*="tx-"]{animation-duration:.18s!important;}
  #cinema-fx *{animation-duration:.18s!important;}
}

</style>
</head>

const frames=[document.getElementById('stage-a'),document.getElementById('stage-b')];
let activeSlot=0;
let index=0;
let navToken=0;
let observer=null;
let switching=false;
let fullscreenRequested=false;
function enterFullscreen(){
  if(fullscreenRequested) return;
  fullscreenRequested=true;
  if(!document.fullscreenElement && document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}


// 页与页之间的转场编排。索引代表“进入的页面”：
// 0 封面；1 引言；2~10 正文1~正文9。
// 大部分使用常规平滑/左右推页，只在重点节点保留电影感。
const transitionPlan=[
  null,
  'fade',        // 封面 → 引言：平滑
  'slide-left',  // 引言 → 正文1：左推
  'fade',        // 正文1 → 正文2：常规
  'slide-left',  // 正文2 → 正文3：左推
  'soft',        // 正文3 → 正文4：轻微景深
  'cinema',      // 正文4 → 正文5：重点节点
  'slide-right', // 正文5 → 正文6：右推，改变节奏
  'fade',        // 正文6 → 正文7：常规
  'slide-left',  // 正文7 → 正文8：左推
  'cinema'       // 正文8 → 正文9：结尾前重点转场
];
const transitionDurations={fade:560,'slide-left':620,'slide-right':620,soft:650,cinema:780};
const txClasses=[
  'tx-fade-out','tx-fade-in','tx-slide-left-out','tx-slide-left-in',
  'tx-slide-right-out','tx-slide-right-in','tx-soft-out','tx-soft-in',
  'tx-cinema-out','tx-cinema-in'
];
function clearTx(frame){ frame.classList.remove(...txClasses); }
function transitionFor(from,to){
  const boundary=Math.max(from,to);
  let type=transitionPlan[boundary]||'fade';
  // 返回上一页时，左右推页自动反向，操作方向更符合直觉。
  if(to<from){
    if(type==='slide-left') type='slide-right';
    else if(type==='slide-right') type='slide-left';
  }
  return type;
}

function decodeUtf8Base64(b64){
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function maxTransitionMs(el){
  const cs=el.ownerDocument.defaultView.getComputedStyle(el);
  const parseList=(s)=>s.split(',').map(v=>{
    v=v.trim();
    if(v.endsWith('ms')) return parseFloat(v)||0;
    if(v.endsWith('s')) return (parseFloat(v)||0)*1000;
    return 0;
  });
  const ds=parseList(cs.transitionDuration||'0s');
  const ls=parseList(cs.transitionDelay||'0s');
  const n=Math.max(ds.length,ls.length);
  let max=0;
  for(let i=0;i<n;i++) max=Math.max(max,(ds[i%ds.length]||0)+(ls[i%ls.length]||0));
  return max;
}

function writePage(frame,pageIndex,onReady){
  frame.onload=()=>{
    frame.dataset.page=String(pageIndex);
    if(onReady) onReady();
  };
  frame.srcdoc=decodeUtf8Base64(pages[pageIndex].b64);
}

function clearObserver(){
  if(observer){ observer.disconnect(); observer=null; }
}

function warmNext(){
  const next=index+1;
  if(next>=pages.length) return;
  const slot=1-activeSlot;
  const frame=frames[slot];
  frame.classList.remove('is-active');
  frame.style.zIndex='1';
  // Hidden warm-up only: primes Tailwind/fonts/images in browser cache.
  // It is reloaded just before the real hand-off so every original page animation still starts fresh.
  writePage(frame,next,null);
}

function attachActive(frame,pageIndex,token){
  clearObserver();
  const w=frame.contentWindow;
  const d=frame.contentDocument;
  if(!w || !d) return;

  w.addEventListener('click',enterFullscreen,{capture:true});

  // Previous-page support only; forward actions remain entirely controlled by each original page.
  w.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowLeft' && pageIndex>0){
      e.preventDefault();
      e.stopImmediatePropagation();
      goDirect(pageIndex-1);
    }
  },true);

  const slide=d.getElementById('slide-container');
  if(!slide) return;
  let leaving=false;
  observer=new MutationObserver(()=>{
    if(token!==navToken || leaving || switching || !slide.classList.contains('slide-transition')) return;
    leaving=true;
    if(pageIndex>=pages.length-1) return;
    const delay=Math.max(0,maxTransitionMs(slide));
    goForward(pageIndex+1,delay,token);
  });
  observer.observe(slide,{attributes:true,attributeFilter:['class']});
}

function swapTo(slot,newIndex,token){
  if(token!==navToken) return;
  const oldSlot=activeSlot;
  const incoming=frames[slot];
  const outgoing=frames[oldSlot];
  const type=transitionFor(index,newIndex);
  const duration=transitionDurations[type]||560;

  // 新页已预载完成；所有整页转场只作用于两个外层 iframe。
  clearTx(incoming); clearTx(outgoing);
  incoming.classList.remove('is-active');
  incoming.style.zIndex='3';
  outgoing.style.zIndex='2';

  // 强制布局提交，保证每次动画都从 0% 帧启动。
  void incoming.offsetWidth;
  document.body.classList.remove('is-cinema');
  if(type==='cinema'){
    void document.body.offsetWidth;
    document.body.classList.add('is-cinema');
  }
  outgoing.classList.add(`tx-${type}-out`);
  incoming.classList.add(`tx-${type}-in`);

  setTimeout(()=>{
    if(token!==navToken) return;
    outgoing.classList.remove('is-active');
    clearTx(outgoing);
    outgoing.style.zIndex='1';
    incoming.classList.add('is-active');
    clearTx(incoming);
    incoming.style.zIndex='2';
    document.body.classList.remove('is-cinema');
    activeSlot=slot;
    index=newIndex;
    switching=false;
    attachActive(incoming,newIndex,token);
    warmNext();
  },duration+24);
}
function goForward(target,leaveDelay,sourceToken){
  if(switching || sourceToken!==navToken || target<0 || target>=pages.length) return;
  switching=true;
  clearObserver();
  const slot=1-activeSlot;
  const incoming=frames[slot];
  incoming.classList.remove('is-active');
  clearTx(incoming);
  incoming.style.zIndex='1';

  // 立即从缓存中重新载入下一页，让它自己的入场动画从头开始；
  // 原页的内部离场动画与此同时照常执行，二者都不被修改。
  let revealed=false;
  const reveal=()=>{
    if(revealed || sourceToken!==navToken) return;
    revealed=true;
    swapTo(slot,target,sourceToken);
  };

  writePage(incoming,target,()=>{
    if(sourceToken!==navToken) return;
    // 给原页离场动画一个很短的“呼吸帧”，随后进入整页电影遮切。
    setTimeout(reveal,Math.min(90,Math.max(24,leaveDelay*0.18)));
  });

}
function goDirect(target){
  if(target<0 || target>=pages.length || switching) return;
  navToken++;
  const token=navToken;
  switching=true;
  clearObserver();
  const slot=1-activeSlot;
  const incoming=frames[slot];
  incoming.classList.remove('is-active');
  clearTx(incoming);
  incoming.style.zIndex='1';
  writePage(incoming,target,()=>swapTo(slot,target,token));
}
function start(){
  const token=++navToken;
  const frame=frames[0];
  writePage(frame,0,()=>{
    index=0;
    activeSlot=0;
    switching=false;
    attachActive(frame,0,token);
    warmNext();
  });
}



start();
})();
</script>
